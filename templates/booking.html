<!DOCTYPE html>
<html>
<style>
input[type=text], select {
  width: 100%;
  padding: 12px 20px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
}

input[type=number], select {
  width: 100%;
  padding: 12px 20px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
}


input[type=submit] {
  width: 100%;
  background-color: #4CAF50;
  color: white;
  padding: 14px 20px;
  margin: 8px 0;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

input[type=email], select {
  width: 100%;
  padding: 12px 20px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
}


input[type=submit]:hover {
  background-color: #45a049;
}

div {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
}

ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color:lightblue;
}

li {
  float: left;

}

li a {
  display: block;
  color:black;
  text-align: left;
  padding: 16px 16px;
  text-decoration:none;
}
.active{
    text-decoration: whitesmoke;
}
</style>
<body>
<div>
  <ul>
        <li><a class="active" href="{% url 'home1'%}">Home</a></li>
        <li><a href="{% url 'history'%}">History</a></li>
        <li><a href="{% url 'biography'%}">Biography</a></li>
        <li><a href="{% url 'poetry'%}">Poetry</a></li>
        <li><a href="{% url 'fantasy'%}">Fantasy</a></li>
        <li><a href="{% url 'classics'%}">Classics</a></li>
        <li><a href="{% url 'about'%}">About</a></li> <br><br>
</ul>
</div>

  <form method="post" action="booking">
      {% csrf_token %}

    <label>address</label>
    <input type="text" id="lname" name="address" placeholder="home">

    <label>Phone Number</label>
    <input type=number id="lname" name="number" placeholder="123456789">
    
    <label>Email</label>

    <label>Book ID</label>

    <input type="submit" value="Submit">

</html>
