<!DOCTYPE html>
<head>
<style>
  hr { 
    display: block;
    margin-top: 0.5em;
    margin-bottom: 0.5em;
    margin-left: auto;
    margin-right: auto;
    border-style: inset;
    border-width: 1px;
  } 
  </style>
</head>
<body style="background-color: lightgrey;">
<h1 style="text-align: center; color: purple;">Reset Your Password </h1>
<hr>
<marquee width="100%" direction="right" height="30px" bgcolor="gray">
     ... Please Provide Valid Details Only & Don't Forgot again ...
  </marquee>
<hr>
<body>
<form method="POST" action="passwordreset">
    {% csrf_token %}
    <p>UserName<input type="text" name="uname"></p><br>
    <p>Email<input type="text" name="email"></p><br>
    <p><lable>New Password    </lable><input type="password" name="password"></p><br>
    <input type="submit" value="Reset Password" style="background-color: lightgreen;">
    {{errmsg}}
    <p><a href="{% url 'login'%}"><I>Login</I></a></p>
</form>

</body>
</html>
